set -g default-shell /bin/zsh
set -s default-terminal 'xterm-256color'
set -ga terminal-overrides ',*256col*:Tc'

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g mouse on

setw -g mode-keys vi

unbind-key -a

bind-key h previous-window
bind-key l next-window
bind-key n new-window -c '#{pane_current_path}'
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key c split-window -v -c '#{pane_current_path}' 'git commit'
bind-key b break-pane
bind-key j choose-window 'join-pane -h -s "%%"'
bind-key r source-file ~/.tmux.conf \; display "Reloaded!"

bind-key -n M-h resize-pane -L
bind-key -n M-j resize-pane -D
bind-key -n M-k resize-pane -U
bind-key -n M-l resize-pane -R

bind -n C-h if "$(tmux display-message -p '#{pane_current_command}') =~ '(vim|nvim)'" 'send-keys C-h' 'select-pane -L'
bind -n C-j if "$(tmux display-message -p '#{pane_current_command}') =~ '(vim|nvim)'" 'send-keys C-j' 'select-pane -D'
bind -n C-k if "$(tmux display-message -p '#{pane_current_command}') =~ '(vim|nvim)'" 'send-keys C-k' 'select-pane -U'
bind -n C-l if "$(tmux display-message -p '#{pane_current_command}') =~ '(vim|nvim)'" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi 0 send-keys -X start-of-line
bind-key -T copy-mode-vi Space send-keys -X cursor-down

set -g status on
set -g status-right ""
set -g status-right-length 0
set -g status-left-length 20
set -g status-left "#[fg=#282c34,bg=#61afef,bold] #S "
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g window-status-format "#[fg=#5c6370,bg=#282c34] #I:#W "
set -g window-status-current-format "#[fg=#282c34,bg=#98c379,bold] #I:#W "
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#61afef,fg=#282c34,bold"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-status 'none'

run '~/.tmux/plugins/tpm/tpm'

set -g status-right ""
set -g status-right-length 0
